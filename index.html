<title>Abzweig</title>
<style>
:root{
  --bg:#0a0c0f;--bg2:#121519;--card:#16191e;--card2:#1d2127;
  --glass:rgba(20,23,28,.72);--glass2:rgba(34,38,45,.62);
  --stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.15);
  --text:#f3f4f6;--text2:#b2b9c1;--text3:#858d96;
  --accent:#ff8a2a;--on-accent:#1b0f03;--accent-soft:rgba(255,138,42,.16);
  --good:#34c77b;--warn:#ffc935;--bad:#ff5a5f;--info:#4f9bff;
  --y:#f5c400;--blue:#0a5aa6;--brown:#6e4325;--ink:#101010;
  --r1:10px;--r2:14px;--r3:20px;--r4:28px;
  --ease:cubic-bezier(.2,.8,.2,1);--t1:140ms;--t2:240ms;--t3:420ms;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --din:"DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --dockH:calc(150px + var(--sb));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sys);font-size:16px;line-height:1.4;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
#app{min-height:100dvh}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.35)}
.press{transition:transform var(--t1) var(--ease),opacity var(--t1),background var(--t2)}
.press:active{transform:scale(.96);opacity:.85}
.ico{width:22px;height:22px}
.ico-s{width:18px;height:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes signin{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,138,42,.55)}50%{box-shadow:0 0 0 8px rgba(255,138,42,0)}}
@keyframes roadmv{to{transform:translateX(-52px)}}
@keyframes twinkle{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

/* ---------- Shell / Tabs ---------- */
.shell{min-height:100dvh;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 104px)}
.lt{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:8px 4px 16px}
.lt small{display:block;font-size:13px;font-weight:600;letter-spacing:.2px;color:var(--text3);margin-bottom:2px;text-transform:uppercase}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 10px);width:min(420px,calc(100% - 28px));height:66px;border-radius:33px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:27px;color:var(--text3);font-size:11px;font-weight:700;transition:color var(--t2),background var(--t2)}
.tab.on{color:var(--accent);background:rgba(255,255,255,.07)}
.sec{margin-top:24px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.sh h2{font-size:20px;font-weight:750;letter-spacing:-.2px}
.sh span{font-size:14px;color:var(--text3);font-weight:600}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r3)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r4);padding:20px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,138,42,.22),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(79,155,255,.16),transparent 60%),var(--card);border:1px solid var(--stroke2);animation:rise var(--t3) var(--ease) both}
.hero .lab{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.3px;text-transform:uppercase;display:flex;justify-content:space-between}
.hero-route{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:16px 0 18px}
.hero-route .line{display:flex;align-items:center;gap:8px;color:var(--text3);font-size:13px;font-weight:600;padding-left:12px}
.hero-route .line i{display:block;width:2px;height:22px;background:repeating-linear-gradient(var(--text3) 0 4px,transparent 4px 8px)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:17px;font-size:17px;font-weight:750;width:100%}
.btn-p{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 22px rgba(255,138,42,.28)}
.btn-s{background:var(--card2);color:var(--text);border:1px solid var(--stroke)}
.btn-g{background:rgba(255,255,255,.08);color:var(--text)}
.btn-d{background:rgba(255,90,95,.12);color:var(--bad)}
.btn[disabled]{opacity:.4}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r2);padding:12px}
.tile b{display:block;font-size:22px;font-weight:750;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--text3);font-weight:600}
.endless{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--r3);background:linear-gradient(135deg,#0b4f93,#0a5aa6 55%,#0d6cc4);border:1px solid rgba(255,255,255,.18);color:#fff}
.endless .shield{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;box-shadow:inset 0 0 0 2.5px #fff;font-family:var(--din);font-size:26px;flex:none}
.endless b{display:block;font-size:18px;font-weight:750}
.endless small{font-size:13px;opacity:.85}
.endless .chev{margin-left:auto;opacity:.8}
.endless.locked{background:var(--card);color:var(--text3);border-color:var(--stroke)}
.endless.locked .shield{box-shadow:inset 0 0 0 2px var(--text3)}

/* Lists */
.list{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r3);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:60px;width:100%;text-align:left;position:relative}
.li+.li::before{content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--stroke)}
.li .num{width:34px;height:34px;border-radius:10px;background:var(--y);color:var(--ink);display:grid;place-items:center;font-family:var(--din);font-size:18px;flex:none;box-shadow:inset 0 0 0 2px var(--ink)}
.li .num.lock{background:var(--card2);color:var(--text3);box-shadow:none}
.li .num.far{background:var(--blue);color:#fff;box-shadow:inset 0 0 0 2px #fff}
.li .mid{flex:1;min-width:0}
.li .t1{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:13px;color:var(--text3);font-weight:500;margin-top:1px}
.li .end{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.stars-s{color:var(--warn);font-size:13px;letter-spacing:1px}
.stars-s i{font-style:normal;color:#3a3f46}
.li.locked .t1{color:var(--text3)}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--text2)}
.pill.good{background:rgba(52,199,123,.15);color:var(--good)}
.pill.bad{background:rgba(255,90,95,.14);color:var(--bad)}
.empty{padding:22px;text-align:center;color:var(--text3);font-size:14px}

/* Album */
.album{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sight{background:var(--brown);color:#fff;border-radius:12px;padding:4px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:rise var(--t3) var(--ease) both}
.sight>div{border:2px solid rgba(255,255,255,.9);border-radius:9px;padding:10px;display:flex;align-items:center;gap:9px;min-height:64px;font-family:var(--din);font-size:16px;line-height:1.15}
.sight svg{width:26px;height:26px;flex:none}

/* Settings */
.group{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r3);overflow:hidden}
.gl{font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin:22px 6px 8px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;left:14px;right:0;top:0;height:1px;background:var(--stroke)}
.row .rl{flex:1;min-width:0}
.row .rl b{display:block;font-size:16px;font-weight:600}
.row .rl small{display:block;font-size:13px;color:var(--text3);margin-top:1px}
.row .val{color:var(--text3);font-size:15px}
.row.danger b{color:var(--bad)}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:11px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:650;color:var(--text2);transition:background var(--t2),color var(--t2)}
.seg button.on{background:var(--text);color:var(--bg)}
input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:#3a3f46;position:relative;transition:background var(--t2);flex:none;cursor:pointer}
input[type=checkbox].sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform var(--t2) var(--ease)}
input[type=checkbox].sw:checked{background:var(--good)}
input[type=checkbox].sw:checked::after{transform:translateX(20px)}
.foot{text-align:center;color:var(--text3);font-size:12.5px;margin-top:22px;line-height:1.5}

/* Onboarding */
.onb{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 70% at 50% 0%,#1d2229,var(--bg) 70%);display:flex;flex-direction:column;animation:fade var(--t2)}
.onb-top{display:flex;justify-content:flex-end;padding:calc(var(--st) + 12px) 16px 0}
.onb-skip{height:44px;padding:0 14px;color:var(--text2);font-weight:650}
.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 30px;text-align:center;gap:18px}
.slide h2{font-size:28px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.slide p{color:var(--text2);font-size:16px;line-height:1.5;max-width:330px}
.illu{width:100%;max-width:330px;height:250px;display:grid;place-items:center;position:relative}
.dots{display:flex;gap:8px;justify-content:center;padding:10px}
.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);transition:width var(--t2),background var(--t2)}
.dots i.on{width:24px;background:var(--accent)}
.onb-bot{padding:10px 20px calc(var(--sb) + 18px)}

/* Loading */
.load{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px);gap:18px;background:radial-gradient(100% 60% at 50% 0%,#1a1f26,var(--bg) 70%)}
.lcard{padding:22px;border-radius:var(--r4);animation:rise var(--t3) var(--ease) both}
.lroute{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.lroute svg{color:var(--text3)}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--text3);transition:color var(--t2)}
.step .si{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid #3a3f46}
.step.act{color:var(--text)}
.step.act .si{border-color:transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:spin .8s linear infinite}
.step.done{color:var(--text2)}
.step.done .si{background:var(--good);border-color:var(--good);color:#06210f}
.step em{margin-left:auto;font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--accent)}
.lnote{font-size:13px;color:var(--text3);line-height:1.5;text-align:center;padding:0 10px}
.lerr{color:var(--bad);font-size:14px;line-height:1.45;margin-top:14px;padding:12px;border-radius:12px;background:rgba(255,90,95,.1)}
.lbtns{display:grid;gap:10px}

/* Signs (bewährt) */
.ort{background:var(--y);color:var(--ink);font-family:var(--din);border-radius:7px;padding:3px;display:inline-block;max-width:100%;min-width:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ort>span{display:block;border:2px solid var(--ink);border-radius:5px;padding:4px 11px 2px;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.ort.lg>span{font-size:26px;padding:7px 16px 4px}
.ort.sm>span{font-size:16px;padding:3px 9px 1px}
.names{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{display:flex;align-items:baseline;gap:8px;font-family:var(--din);font-size:21px;line-height:1.08}
.nm span{flex:1;min-width:0;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.nm em{font-style:normal;font-size:16px;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.bd{font-family:var(--din);font-size:15px;padding:3px 7px 2px;border-radius:5px;flex:none;white-space:nowrap;line-height:1.1;display:inline-block}
.bd-a{background:var(--blue);color:#fff;box-shadow:inset 0 0 0 2px #fff,0 0 0 1px var(--blue)}
.bd-b{background:var(--y);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.bd-l{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:13px}
.bds{display:flex;flex-direction:column;gap:4px;flex:none;align-items:center}
.arr{width:38px;height:38px;flex:none}
.pic{width:28px;height:28px;flex:none;border-radius:5px;display:grid;place-items:center}
.pic svg{width:21px;height:21px}
.pic.br{background:var(--brown);box-shadow:inset 0 0 0 1.5px #fff}
.pic.bl{background:var(--blue);box-shadow:inset 0 0 0 1.5px #fff;color:#fff}
.queued-tag{position:absolute;top:-11px;right:12px;background:var(--accent);color:var(--on-accent);font-family:var(--sys);font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.4px;z-index:3;display:flex;gap:5px;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.gesperrt{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(-45deg,rgba(229,72,77,.8) 0 14px,rgba(255,255,255,.72) 14px 28px);border-radius:8px;pointer-events:none}
.gesperrt b{background:#fff;color:#d63a3f;font-family:var(--din);font-size:16px;padding:3px 9px;border-radius:5px;border:2.5px solid #d63a3f;font-weight:400}
.mast{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:430px}
.grp{display:flex;flex-direction:column;gap:5px;width:100%}
.grp.L{align-items:flex-start}.grp.R{align-items:flex-end}.grp.S{align-items:center}
.pw{position:relative;width:94%;text-align:left;--tip:30px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.28));transition:filter var(--t2),transform var(--t1) var(--ease)}
.pw:active{transform:scale(.98)}
.pw.small{width:82%;--tip:22px}.pw.small .nm{font-size:17px}
.pw .o,.pw .m,.pw .i{clip-path:var(--cp)}
.pw .o{padding:4px;background:var(--bg)}
.pw .m{padding:2.5px;background:var(--fg)}
.pw .i{background:var(--bg);color:var(--fg);padding:8px 12px;display:flex;align-items:center;gap:10px;min-height:50px}

/* ---------- Game ---------- */
.game{height:100dvh;position:relative;overflow:hidden;background:#0d1014}

.tod-night .backdrop{background:linear-gradient(180deg,#05070d 0%,#0c1424 50%,#17233a 80%,#14181e 100%)}
.starsky{position:absolute;inset:0 0 40% 0;opacity:0;transition:opacity 1.2s;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 32% 8%,#fff,transparent),radial-gradient(1.2px 1.2px at 58% 22%,#fff,transparent),radial-gradient(1px 1px at 76% 12%,#fff,transparent),radial-gradient(1.3px 1.3px at 88% 30%,#fff,transparent),radial-gradient(1px 1px at 22% 38%,#fff,transparent),radial-gradient(1px 1px at 46% 44%,#fff,transparent),radial-gradient(1.2px 1.2px at 68% 40%,#fff,transparent);animation:twinkle 4s ease-in-out infinite}

.posts{position:absolute;top:calc(var(--st) + 170px);bottom:calc(var(--dockH) + 26px);left:50%;width:min(440px,calc(100% - 28px));transform:translateX(-50%)}

.posts.two i:first-child{left:22%}.posts.two i:last-child{right:22%}
.posts.one i:first-child{left:calc(50% - 5px)}.posts.one i:last-child{display:none}
.tod-night .vw,.tod-night .tb,.tod-night .mast,.tod-night .umleit{filter:brightness(.93) drop-shadow(0 0 18px rgba(255,220,120,.12))}
.scene{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scene-in{min-height:100%;padding:calc(var(--st) + 128px) 14px calc(var(--dockH) + 46px);display:flex;flex-direction:column;align-items:center;gap:12px}
.toprow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;position:relative;z-index:2;min-height:40px}
.here{display:flex;align-items:center;gap:8px}
.otafel{background:var(--y);color:var(--ink);border-radius:8px;padding:4px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.otafel>span{display:block;border:2.5px solid var(--ink);border-radius:5px;padding:5px 14px 3px;font-family:var(--din);font-size:22px;line-height:1}
.otafel.out{background:#fff}.otafel.out>span{position:relative;font-size:17px;color:#333}
.otafel.out>span::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:5px;background:#d63a3f;transform:rotate(-14deg)}
.otafel.blue{background:var(--blue);color:#fff}.otafel.blue>span{border-color:#fff;font-size:18px}
.dist{font-size:15px;font-weight:750;color:#fff;padding:9px 15px;border-radius:999px;background:rgba(10,14,20,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px}

.signs{display:contents}
.note{position:relative;z-index:2;font-size:14px;font-weight:600;color:#fff;background:rgba(10,14,20,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 14px;border-radius:14px;text-align:center;max-width:400px;border:1px solid rgba(255,255,255,.1)}

.unter svg{width:30px;height:30px;flex:none}

.hud{position:absolute;left:10px;right:10px;top:calc(var(--st) + 8px);border-radius:24px;padding:10px 10px 11px;z-index:10;display:grid;gap:9px}
.hud-top{display:flex;align-items:center;gap:10px}
.ib{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none;position:relative;color:var(--text)}

.ziel{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}

.gauge b{color:var(--text);font-weight:750;min-width:56px;text-align:right}
.dock{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 8px);border-radius:26px;padding:12px;z-index:10;display:flex;gap:12px;height:142px}

.ctrl{display:flex;gap:8px}

.mini .n{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:11px;background:rgba(10,14,20,.75);font-size:10px;font-weight:900;color:var(--text2);display:grid;place-items:center}
.mini .ex{position:absolute;bottom:6px;right:6px;width:24px;height:24px;border-radius:8px;background:rgba(10,14,20,.75);display:grid;place-items:center;color:var(--text2)}

.fullmap{position:fixed;inset:0;z-index:40;background:#0f1418;animation:fade var(--t2)}
.fullmap canvas{width:100%;height:100%;display:block;touch-action:none}
.fm-top{position:absolute;left:12px;right:12px;top:calc(var(--st) + 10px);display:flex;justify-content:space-between;align-items:center}
.fm-close{height:46px;padding:0 16px;border-radius:15px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}

.fm-btns{position:absolute;right:12px;bottom:calc(var(--sb) + 20px);display:flex;flex-direction:column;border-radius:18px;overflow:hidden}

.fm-btns button+button{border-top:1px solid var(--stroke)}

/* Sheets & overlays */
.ov{position:fixed;inset:0;z-index:30;background:rgba(5,7,10,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade var(--t2)}
.ov.center{align-items:center;padding:20px}
.sheetc{width:100%;max-width:500px;border-radius:30px 30px 0 0;padding:10px 20px calc(var(--sb) + 20px);animation:sheet var(--t3) var(--ease) both;background:rgba(24,27,32,.9);border:1px solid var(--stroke2);border-bottom:0}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 14px}
.sheet-lbl{font-size:13px;font-weight:750;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;text-align:center}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:rgba(255,255,255,.06);border-radius:16px;padding:12px 6px;text-align:center}

.tip{display:flex;gap:10px;font-size:14.5px;line-height:1.45;color:var(--text2);margin:16px 2px 18px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04)}

.dlg{width:100%;max-width:380px;border-radius:26px;padding:22px 20px 18px;animation:rise var(--t3) var(--ease) both;background:rgba(24,27,32,.94);border:1px solid var(--stroke2);max-height:86vh;overflow:auto}

.ctxt{text-align:center;color:var(--text2);font-size:15px}

.diag{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:#07090b;border-radius:12px;padding:12px;margin:12px 0;color:#cfd3d7;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;top:calc(var(--st) + 128px);transform:translateX(-50%);padding:11px 16px;border-radius:16px;font-size:14px;font-weight:650;z-index:60;animation:toastin var(--t2) var(--ease) both;max-width:88vw;text-align:center;pointer-events:none;display:flex;gap:8px;align-items:center;color:#fff}

.toast.blue{background:rgba(10,90,166,.94);border:1px solid rgba(255,255,255,.3)}

/* Result */
.res{min-height:100dvh;padding:calc(var(--st) + 22px) 16px calc(var(--sb) + 26px);background:radial-gradient(120% 50% at 50% 0%,#1d222a,var(--bg) 70%)}

@media (max-width:360px){.lt{font-size:30px}.tiles{grid-template-columns:1fr 1fr}.mini{width:100px;height:100px}.dock{height:128px}:root{--dockH:calc(136px + var(--sb))}}

/* ---------- 4.1: Interaktion ---------- */
.press{transition:transform 260ms cubic-bezier(.34,1.56,.64,1),opacity var(--t1),background var(--t2),box-shadow var(--t2)}
.press:active{transform:scale(.94);opacity:.9;transition-duration:90ms}

.vb:active{box-shadow:0 0 0 3px rgba(255,138,42,.6)}
.tr:active{box-shadow:0 0 0 3px rgba(255,138,42,.6)}
@keyframes tapspring{0%{transform:scale(1)}28%{transform:scale(.93)}62%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes tapglow{0%{box-shadow:0 0 0 0 rgba(255,138,42,.9)}100%{box-shadow:0 0 0 22px rgba(255,138,42,0)}}

.pw.tapped{animation:tapspring 420ms cubic-bezier(.34,1.56,.64,1),tapglowf 600ms ease-out}
.tr.tapped,.abr.tapped{animation:tapspring 420ms cubic-bezier(.34,1.56,.64,1),tapglow 600ms ease-out}
.vb.tapped{animation:tapglow 600ms ease-out}
.vb.S.tapped{animation:tapglow 600ms ease-out}
.queued-tag{animation:rise .3s var(--ease) both}
.queued-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--on-accent);animation:twinkle 1s steps(1) infinite}

.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.dbtn{height:46px;padding:0 15px 0 12px;border-radius:15px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:750;color:var(--text)}
.dbtn svg{width:19px;height:19px}
.dbtn.go{background:var(--accent);color:var(--on-accent)}
.dbtn.fuel{background:var(--info);color:#fff;animation:pulse 1.6s infinite}
.mini .pull{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:30px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.mini{touch-action:none}

.mapsheet{position:absolute;left:0;right:0;bottom:0;height:min(66vh,620px);border-radius:30px 30px 0 0;z-index:15;transform:translateY(105%);transition:transform 440ms cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden;background:rgba(15,19,24,.94);border-bottom:0}
.mapsheet.open{transform:translateY(0)}
.ms-head{padding:8px 14px 8px;touch-action:none;cursor:grab}
.ms-grab{display:block;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 8px}
.ms-bar{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:var(--text2)}
.ms-close{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--text)}
.ms-body{flex:1;position:relative;margin:0 8px calc(var(--sb) + 8px);border-radius:20px;overflow:hidden;background:#0f1418}
.ms-body canvas{width:100%;height:100%;display:block;touch-action:none}
.ms-body .fm-btns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.ms-body .fm-btns button{width:48px;height:48px;display:grid;place-items:center;color:#fff}
.ms-body .fm-btns button+button{border-top:1px solid var(--stroke)}
.ms-paused{position:absolute;left:10px;top:10px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:rgba(10,14,20,.8);color:var(--warn);letter-spacing:.3px}


.coach{position:absolute;inset:0;z-index:12;pointer-events:none;animation:fade .3s}
.coach.out{opacity:0;transition:opacity .25s}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.4);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
@keyframes handtap{0%,100%{transform:translate(-20%,0) scale(1)}45%{transform:translate(-20%,-6px) scale(1.05)}60%{transform:translate(-20%,2px) scale(.92)}}
.coach-ring{position:absolute;width:56px;height:56px;border-radius:50%;border:3px solid var(--accent);animation:ring 1.4s ease-out infinite}
.coach-hand{position:absolute;color:#fff;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:handtap 1.4s ease-in-out infinite}
.coach-hand svg{width:46px;height:46px;fill:rgba(20,23,28,.85)}
.coach-bubble{position:absolute;left:20px;right:20px;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;font-size:14.5px;color:var(--text2);line-height:1.4;animation:rise .4s var(--ease) both}
.coach-bubble b{color:var(--text);font-size:16px}

::view-transition-old(root){animation:vtout 200ms ease-in both}
::view-transition-new(root){animation:vtin 340ms cubic-bezier(.2,.8,.2,1) both}
@keyframes vtout{to{opacity:0;transform:scale(.985)}}
@keyframes vtin{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}

@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.toast svg{width:22px;height:22px;flex:none}
.ctrl{flex-wrap:nowrap}
.dbtn{padding:0 12px 0 10px;gap:6px;font-size:14px}
.game::after{content:"";position:absolute;inset:0;background:rgba(5,8,12,0);pointer-events:none;transition:background .35s;z-index:14}
.navi-open::after{background:rgba(5,8,12,.5)}

.toast{width:max-content;max-width:88vw}

/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */
const D2R=Math.PI/180;
function hav(a1,o1,a2,o2){const dA=(a2-a1)*D2R,dO=(o2-o1)*D2R;const x=Math.sin(dA/2)**2+Math.cos(a1*D2R)*Math.cos(a2*D2R)*Math.sin(dO/2)**2;return 12742*Math.asin(Math.sqrt(x));}
function bearing(a1,o1,a2,o2){const p1=a1*D2R,p2=a2*D2R,dl=(o2-o1)*D2R;const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (Math.atan2(y,x)/D2R+360)%360;}
const angDiff=(a,b)=>((b-a+540)%360)-180;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmtKm=k=>k<1?(Math.round(k*10)*100)+' m':(k<10?k.toFixed(1).replace('.',','):Math.round(k))+' km';

/* Speicher */

save.set=Object.assign({sound:true,voice:true,haptic:true,tod:'auto'},save.set||{});save.lv=save.lv||{};save.hist=save.hist||[];
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}

/* IndexedDB-Cache für geladene Regionen */
let _db=null;
const withTO=(p,ms,v)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(v),ms))]);
function idb(){return new Promise((res,rej)=>{if(_db)return res(_db);if(!window.indexedDB)return rej(new Error('kein IndexedDB'));const r=indexedDB.open('abzweig',1);r.onupgradeneeded=()=>r.result.createObjectStore('regions');r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);});}
async function cacheGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('regions').objectStore('regions').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function cachePut(k,v){try{const db=await idb();await new Promise(res=>{const t=db.transaction('regions','readwrite');t.objectStore('regions').put(v,k);t.oncomplete=res;t.onerror=res;});}catch(e){DIAG.errors.push('Cache: '+e.message);}}
async function cacheInfo(){try{const db=await idb();return await new Promise(res=>{const out={n:0,bytes:0};const c=db.transaction('regions').objectStore('regions').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.n++;out.bytes+=(cur.value&&cur.value.text||'').length;cur.continue();}else res(out);};c.onerror=()=>res(out);});}catch(e){return {n:0,bytes:0};}}
async function cacheClear(){try{const db=await idb();await new Promise(res=>{const t=db.transaction('regions','readwrite');t.objectStore('regions').clear();t.oncomplete=res;t.onerror=res;});}catch(e){}}

/* =========================================================
   OSM LADEN
   ========================================================= */
function localXY(lat0,lon0){const kx=111.32*Math.cos(lat0*D2R),ky=110.57;return {to:(la,lo)=>[(lo-lon0)*kx,(la-lat0)*ky],from:(x,y)=>[lat0+y/ky,lon0+x/kx]};}
function corridor(s,t,wKm,mKm){
  const P=localXY(s[1],s[2]);const [tx,ty]=P.to(t[1],t[2]);const L=Math.hypot(tx,ty)||1;const ux=tx/L,uy=ty/L,nx=-uy,ny=ux;
  const pts=[[-mKm,-wKm],[L+mKm,-wKm],[L+mKm,wKm],[-mKm,wKm]].map(([a,b])=>P.from(ux*a+nx*b,uy*a+ny*b));
  return pts.map(p=>p[0].toFixed(5)+' '+p[1].toFixed(5)).join(' ');
}
function square(p,r){const P=localXY(p[1],p[2]);return [[-r,-r],[r,-r],[r,r],[-r,r]].map(([x,y])=>P.from(x,y)).map(q=>q[0].toFixed(5)+' '+q[1].toFixed(5)).join(' ');}
function bboxAround(pts,padKm){const la=pts.map(p=>p[1]),lo=pts.map(p=>p[2]);const mLa=(Math.min(...la)+Math.max(...la))/2;const dLa=padKm/110.57,dLo=padKm/(111.32*Math.cos(mLa*D2R));return [Math.min(...la)-dLa,Math.min(...lo)-dLo,Math.max(...la)+dLa,Math.max(...lo)+dLo].map(v=>v.toFixed(4)).join(',');}
function buildQuery(s,t){
  const L=hav(s[1],s[2],t[1],t[2]);
  const hw='way["highway"~"^(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link)$"]';
  const kw='way["highway"~"^(tertiary|tertiary_link|unclassified)$"]["ref"~"^[LK] ?[0-9]"]';
  let area,kParts;
  if(L<=45){area='('+bboxAround([s,t],6)+')';kParts=kw+area+';';}
  else{area='(poly:"'+corridor(s,t,Math.max(8,Math.min(14,L*.2)),6)+'")';kParts=kw+'('+bboxAround([s],8)+');'+kw+'('+bboxAround([t],8)+');';}
  return '[out:json][timeout:90][maxsize:268435456];('+hw+area+';'+kParts+')->.r;.r out body;.r >;out skel qt;node(w.r)["highway"="motorway_junction"];out body qt;('
    +'node["place"~"^(city|town|village|suburb)$"]'+area+';node["amenity"="fuel"]'+area+';node["tourism"~"^(attraction|museum|theme_park|zoo|viewpoint)$"]["name"]'+area+';node["historic"~"^(castle|monument)$"]["name"]'+area+';);out body qt;';
}
let FETCHES=[];
function abortFetches(){FETCHES.forEach(c=>{try{c.abort();}catch(e){}});FETCHES=[];}
async function fetchOverpass(q,onProg){
  if(window.__OSM_FIXTURE__)return {text:JSON.stringify(window.__OSM_FIXTURE__),ep:'fixture'};
  abortFetches();let won=false;const prog={};
  const one=ep=>new Promise(async(res,rej)=>{
    const ctrl=new AbortController();FETCHES.push(ctrl);const to=setTimeout(()=>ctrl.abort(),80000);
    const host=ep.replace('https://','').split('/')[0];
    try{
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctrl.signal});
      if(!r.ok)throw new Error('HTTP '+r.status+(r.status===429?' (zu viele Anfragen)':r.status===504?' (Server überlastet)':''));
      let text='';
      if(r.body&&r.body.getReader){const rd=r.body.getReader(),dec=new TextDecoder();let n=0;for(;;){const {done,value}=await rd.read();if(done)break;n+=value.length;text+=dec.decode(value,{stream:true});prog[host]=n;if(!won)onProg(Math.max(...Object.values(prog)),host);}text+=dec.decode();}
      else text=await r.text();
      clearTimeout(to);
      if(text.trim()[0]!=='{')throw new Error('keine JSON-Antwort ('+text.replace(/<[^>]+>/g,' ').trim().slice(0,90)+')');
      const m=/"remark"\s*:\s*"([^"]*)"/.exec(text.slice(-800));
      if(m&&/error|timed out|out of memory|runtime/i.test(m[1]))throw new Error('Server: '+m[1]);
      res({text,ep:host});
    }catch(e){clearTimeout(to);if(!won)DIAG.errors.push(host+': '+(e.name==='AbortError'?'Zeitüberschreitung (80 s)':e.message));rej(e);}
  });
  const r=await new Promise((res,rej)=>{let n=EPS.length;EPS.forEach(ep=>one(ep).then(v=>{if(!won){won=true;res(v);}},()=>{if(--n===0)rej(new Error('Kein Kartenserver hat geantwortet. Prüfe die Internetverbindung oder versuch es in einer Minute nochmal.'));}));});
  abortFetches();return r;
}

/* =========================================================
   STRASSENNETZ AUFBAUEN
   ========================================================= */
const GS=0.01;const gk=(la,lo)=>Math.floor(la/GS)*40000+Math.floor(lo/GS);
function gadd(g,la,lo,v){const k=gk(la,lo);let a=g.get(k);if(!a){a=[];g.set(k,a);}a.push(v);}
function gnear(g,la,lo,r){const dl=r/111,dn=r/(111*Math.cos(la*D2R));const out=[];for(let a=Math.floor((la-dl)/GS);a<=Math.floor((la+dl)/GS);a++)for(let b=Math.floor((lo-dn)/GS);b<=Math.floor((lo+dn)/GS);b++){const arr=g.get(a*40000+b);if(arr)for(const v of arr)out.push(v);}return out;}
const HW=/^(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified)$/;
const RANK={city:3,town:2,village:1,suburb:0};
const PRAD={3:4.0,2:2.0,1:0.9,0:0.7};
function normRef(r){return (r||'').split(';')[0].trim().replace(/^([ABLK])\s*(\d)/,'$1 $2');}
function buildGraph(data){
  const t0=performance.now();
  const nodeById=new Map(),ways=[];
  for(const el of data.elements){if(el.type==='node')nodeById.set(el.id,el);else if(el.type==='way'&&el.tags&&el.tags.highway)ways.push(el);}
  const W=[];let destCount=0;
  for(const w of ways){
    const t=w.tags;if(!HW.test(t.highway)||t.area==='yes'||t.access==='no'||t.motor_vehicle==='no')continue;
    const ref=normRef(t.ref),isLink=/_link$/.test(t.highway);
    let cls=/^A \d/.test(ref)?'A':/^B \d/.test(ref)?'B':/^L \d/.test(ref)?'L':/^K \d/.test(ref)?'K':/^motorway/.test(t.highway)?'A':/^(trunk|primary)/.test(t.highway)?'B':/^secondary/.test(t.highway)?'L':'K';
    if(/^motorway/.test(t.highway))cls='A';
    const rb=t.junction==='roundabout'||t.junction==='circular';
    let ow=0;if(/^(yes|true|1)$/.test(t.oneway||''))ow=1;else if(/^(-1|reverse)$/.test(t.oneway||''))ow=-1;else if(t.oneway==='no')ow=0;else if(t.highway==='motorway'||t.highway==='motorway_link'||rb)ow=1;
    const dest=t.destination?t.destination.split(';').map(s=>s.trim()).filter(Boolean):null;
    const destRef=t['destination:ref']?t['destination:ref'].split(';').map(s=>normRef(s)).filter(Boolean):null;
    if(dest)destCount++;
    W.push({id:w.id,nodes:w.nodes,hw:t.highway,ref,name:t.name||'',cls,isLink,rb,ow,dest,destRef,ident:rb?'rb':isLink?'link':(ref||t.name||('w'+w.id))});
  }
  const idx=new Map(),LA=[],LO=[],NT=[];
  const gi=id=>{let i=idx.get(id);if(i===undefined){const n=nodeById.get(id);if(!n||n.lat===undefined)return -1;i=LA.length;idx.set(id,i);LA.push(n.lat);LO.push(n.lon);NT.push(n.tags&&n.tags.highway==='motorway_junction'?n.tags:null);}return i;};
  const use=[],isEnd=[];
  for(const w of W){w.ix=w.nodes.map(gi).filter(i=>i>=0);w.ix.forEach((i,k)=>{use[i]=(use[i]||0)+1;if(k===0||k===w.ix.length-1)isEnd[i]=1;});}
  const junc=i=>(use[i]||0)>1||isEnd[i]||!!NT[i];
  const E=[],OUT=new Map();
  const bearAt=(pts,cum,start)=>{const n=pts.length;if(start){let k=1;while(k<n-1&&cum[k]<0.03)k++;return bearing(LA[pts[0]],LO[pts[0]],LA[pts[k]],LO[pts[k]]);}const L=cum[n-1];let k=n-2;while(k>0&&L-cum[k]<0.03)k--;return bearing(LA[pts[k]],LO[pts[k]],LA[pts[n-1]],LO[pts[n-1]]);};
  const addEdge=(w,pts)=>{let len=0;const cum=[0];for(let k=1;k<pts.length;k++){len+=hav(LA[pts[k-1]],LO[pts[k-1]],LA[pts[k]],LO[pts[k]]);cum.push(len);}
    const e={id:E.length,from:pts[0],to:pts[pts.length-1],pts,cum,len:Math.max(len,0.001),w,cls:w.cls,ident:w.ident,rev:-1,closed:false};
    e.b0=bearAt(pts,cum,true);e.b1=bearAt(pts,cum,false);E.push(e);let o=OUT.get(e.from);if(!o){o=[];OUT.set(e.from,o);}o.push(e.id);return e;};
  for(const w of W){
    let st=0;
    for(let k=1;k<w.ix.length;k++){
      if(junc(w.ix[k])||k===w.ix.length-1){
        const seg=w.ix.slice(st,k+1);
        if(seg.length>=2&&seg[0]!==seg[seg.length-1]){let f=null,r=null;if(w.ow!==-1)f=addEdge(w,seg);if(w.ow!==1)r=addEdge(w,seg.slice().reverse());if(f&&r){f.rev=r.id;r.rev=f.id;}}
        st=k;
      }
    }
  }
  const juncGrid=new Map(),edgeGrid=new Map();
  for(const [n] of OUT)gadd(juncGrid,LA[n],LO[n],n);
  for(const e of E){if(e.rev>=0&&e.rev<e.id)continue;let lastK=-1;for(const p of e.pts){const k=gk(LA[p],LO[p]);if(k!==lastK){let a=edgeGrid.get(k);if(!a){a=[];edgeGrid.set(k,a);}if(a[a.length-1]!==e.id)a.push(e.id);lastK=k;}}}
  const places=[],fuels=[],sights=[],placeGrid=new Map(),fuelGrid=new Map(),sightGrid=new Map();
  for(const n of nodeById.values()){
    const t=n.tags;if(!t||n.lat===undefined)continue;
    if(t.place&&RANK[t.place]!==undefined&&t.name){const p={name:t.name,lat:n.lat,lon:n.lon,rank:RANK[t.place]};places.push(p);gadd(placeGrid,n.lat,n.lon,p);}
    else if(t.amenity==='fuel'){const f={id:n.id,lat:n.lat,lon:n.lon,name:t.brand||t.name||'Tankstelle'};fuels.push(f);gadd(fuelGrid,n.lat,n.lon,f);}
    else if(t.name&&(t.tourism||t.historic||t.leisure)){const s={name:t.name,lat:n.lat,lon:n.lon};sights.push(s);gadd(sightGrid,n.lat,n.lon,s);}
  }

let rafId=0;

function startLoop(){stopLoop();G.lastT=performance.now();const f=t=>{if(!G||G.done)return;tick(t);if(!G||G.done)return;rafId=requestAnimationFrame(f);};rafId=requestAnimationFrame(f);}

/* ---------- Tageszeit ---------- */
function todNow(){
  const m=save.set.tod;if(m==='day'||m==='night')return m;
  const d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),c=Math.cos(2*Math.PI*(doy-172)/365);
  const sr=6.9-1.6*c,ss=19.1+2.7*c,h=d.getHours()+d.getMinutes()/60;
  if(h<sr-0.6||h>ss+0.6)return 'night';if(h<sr+0.8)return 'dawn';if(h>ss-0.8)return 'dusk';return 'day';
}

/* ---------- Ton, Ansage, Haptik ---------- */
const AU={ctx:null,primed:false};
function audioUnlock(){
  try{if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)AU.ctx=new C();}if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();}catch(e){}
  if(!AU.primed&&window.speechSynthesis){AU.primed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
}
function tone(f,dur,type,vol,delay){const c=AU.ctx;if(!c)return;const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);}
function sfx(n){
  if(!save.set.sound||!AU.ctx)return;
  if(n==='blink'){tone(2100,.025,'square',.05,0);tone(1500,.03,'square',.045,.2);}
  else if(n==='sign'){tone(880,.18,'sine',.05,0);tone(1320,.22,'sine',.035,.09);}
  else if(n==='stop'){tone(523,.16,'sine',.06,0);tone(392,.22,'sine',.05,.12);}
  else if(n==='arrive'){[523,659,784,1047].forEach((f,i)=>tone(f,.6,'sine',.09,i*.13));}
  else if(n==='fuel'){tone(660,.1,'triangle',.08,0);tone(990,.18,'triangle',.07,.1);}
  else if(n==='fail'){tone(330,.35,'triangle',.07,0);tone(247,.5,'triangle',.07,.25);}
  else if(n==='tap'){tone(1200,.02,'sine',.03,0);}
}
let deVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();deVoice=v.find(x=>/^de(-|_)DE/i.test(x.lang)&&/Anna|Helena|Markus|Petra|Siri/i.test(x.name))||v.find(x=>/^de/i.test(x.lang))||null;}catch(e){}}
if(window.speechSynthesis){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function speak(t){if(!save.set.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(deVoice)u.voice=deVoice;u.rate=1.03;speechSynthesis.speak(u);}catch(e){}}
function haptic(){if(!save.set.haptic)return;try{if(navigator.vibrate){navigator.vibrate(12);return;}const l=document.getElementById('hapt');if(l)l.click();}catch(e){}}
const dirWord=t=>t<-120?'scharf links':t<-60?'links':t<-25?'halb links':t>120?'scharf rechts':t>60?'rechts':t>25?'halb rechts':'geradeaus';

  if(!G||!dec||!dec.eIn)return;
  if(dec.eIn.cls==='A'){const nt=R.NT[dec.x];const ex=dec.ops.find(o=>o.exit.w.isLink);if(nt&&ex){sfx('sign');speak(`Ausfahrt ${nt.ref?nt.ref+', ':''}${nt.name||''}`);}else if(nt&&/kreuz|dreieck/i.test(nt.name||'')){sfx('sign');speak(nt.name);}}

const COL={A:'#4f8ee8',B:'#d9b44a',L:'#8a96a3',K:'#4a545e'},WID={A:3.2,B:2.4,L:1.6,K:1.1};
function sizeCanvas(cv){if(!cv)return;const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));cv._d=d;}
function drawMap(cv,cLa,cLo,ppk,opt){
  if(!cv||!cv.getContext)return;const ctx=cv.getContext('2d');if(!ctx)return;
  const d=cv._d||1,w=cv.width/d,h=cv.height/d;ctx.setTransform(d,0,0,d,0,0);
  ctx.fillStyle='#0f1418';ctx.fillRect(0,0,w,h);
  const kx=111.32*Math.cos(cLa*D2R),ky=110.57;
  const X=lo=>w/2+(lo-cLo)*kx*ppk,Y=la=>h/2-(la-cLa)*ky*ppk;
  const rad=Math.hypot(w,h)/2/ppk+0.5;
  const ids=new Set(gnear(R.edgeGrid,cLa,cLo,rad));
  const layers={K:[],L:[],B:[],A:[]};for(const id of ids){const e=R.E[id];(layers[e.cls]||layers.K).push(e);}
  const minCls=ppk<4?'B':ppk<9?'L':'K';const show={A:1,B:1,L:minCls!=='B',K:minCls==='K'};
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const c of ['K','L','B','A']){if(!show[c])continue;ctx.strokeStyle=COL[c];ctx.lineWidth=WID[c]*(ppk>20?1.3:1);ctx.beginPath();
    for(const e of layers[c]){const p=e.pts;ctx.moveTo(X(R.LO[p[0]]),Y(R.LA[p[0]]));for(let k=1;k<p.length;k++)ctx.lineTo(X(R.LO[p[k]]),Y(R.LA[p[k]]));}ctx.stroke();}
  if(G){
    ctx.strokeStyle='#e5484d';ctx.lineWidth=3;
    for(const e of G.closedEdges){const m=e.pts[e.pts.length>>1],x=X(R.LO[m]),y=Y(R.LA[m]);ctx.beginPath();ctx.moveTo(x-5,y-5);ctx.lineTo(x+5,y+5);ctx.moveTo(x-5,y+5);ctx.lineTo(x+5,y-5);ctx.stroke();}
    if(opt.optPath){ctx.setLineDash([7,6]);ctx.strokeStyle='#33b073';ctx.lineWidth=3.5;ctx.beginPath();let first=true;for(const e of G.optPath){for(const p of e.pts){const x=X(R.LO[p]),y=Y(R.LA[p]);if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);}}ctx.stroke();ctx.setLineDash([]);}
    if(G.trail.length>1){ctx.strokeStyle='#ff6b1a';ctx.lineWidth=opt.big?4.5:3;ctx.beginPath();G.trail.forEach((p,i)=>{const x=X(p[1]),y=Y(p[0]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});if(!opt.noCar){const c=carPos();ctx.lineTo(X(c[1]),Y(c[0]));}ctx.stroke();}
  }
  const lblMin=ppk<3?3:ppk<7?2:1;ctx.font=`600 ${opt.big?13:10}px -apple-system,system-ui,sans-serif`;ctx.textAlign='center';
  for(const p of gnear(R.placeGrid,cLa,cLo,rad)){if(p.rank<lblMin)continue;const x=X(p.lon),y=Y(p.lat);if(x<-40||x>w+40||y<-20||y>h+20)continue;ctx.fillStyle='rgba(15,20,24,.75)';const tw=ctx.measureText(p.name).width;ctx.fillRect(x-tw/2-3,y-9,tw+6,13);ctx.fillStyle=p.rank>=2?'#d7dde3':'#97a2ad';ctx.fillText(p.name,x,y+1);}
  if(opt.markers)for(const m of opt.markers){const x=X(m.lon),y=Y(m.lat);ctx.fillStyle=m.c;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.stroke();if(m.t){ctx.font='700 13px -apple-system,sans-serif';const tw=ctx.measureText(m.t).width;ctx.fillStyle=m.c;ctx.fillRect(x-tw/2-6,y-30,tw+12,20);ctx.fillStyle=m.tc||'#101010';ctx.fillText(m.t,x,y-15);}}
  if(G&&!opt.noCar){const c=carPos(),x=X(c[1]),y=Y(c[0]);ctx.save();ctx.translate(x,y);ctx.rotate(c[2]*D2R);ctx.fillStyle='#fff';ctx.strokeStyle='#ff6b1a';ctx.lineWidth=2.5;ctx.beginPath();const s=opt.big?11:8;ctx.moveTo(0,-s);ctx.lineTo(s*.75,s*.8);ctx.lineTo(0,s*.4);ctx.lineTo(-s*.75,s*.8);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
}
let FM=null;
function drawMini(){if(!G||!R)return;const cv=document.getElementById('minicv');if(!cv)return;const c=carPos();drawMap(cv,c[0],c[1],22,{});if(FM&&FM.follow){const c2=carPos();FM.la=c2[0];FM.lo=c2[1];}if(FM)drawMap(FM.cv,FM.la,FM.lo,FM.ppk,{big:true});}
function openFullMap(){
  if(!G)return;const wasRunning=G.running;G.running=false;
  const c=carPos();FM={la:c[0],lo:c[1],ppk:14,follow:true,wasRunning};
  const el=document.createElement('div');el.className='fullmap';el.innerHTML=`<canvas aria-label="Karte"></canvas><div class="fm-top"><button class="fm-close glass press" data-act="closemap">${IC.x} Zurück zur Fahrt</button><div class="fm-n glass" aria-label="Norden oben">N</div></div><div class="fm-btns glass"><button class="press" data-act="zin" aria-label="Vergrößern">${svgI('<path d="M12 5v14M5 12h14"/>')}</button><button class="press" data-act="zout" aria-label="Verkleinern">${svgI('<path d="M5 12h14"/>')}</button><button class="press" data-act="zcar" aria-label="Auf Auto zentrieren">${svgI('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>')}</button></div>`;
  document.body.appendChild(el);FM.el=el;FM.cv=el.querySelector('canvas');sizeCanvas(FM.cv);
  let drag=null;
  FM.cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,la:FM.la,lo:FM.lo};FM.follow=false;FM.cv.setPointerCapture(e.pointerId);});
  FM.cv.addEventListener('pointermove',e=>{if(!drag)return;const kx=111.32*Math.cos(FM.la*D2R);FM.lo=drag.lo-(e.clientX-drag.x)/(kx*FM.ppk);FM.la=drag.la+(e.clientY-drag.y)/(110.57*FM.ppk);drawMap(FM.cv,FM.la,FM.lo,FM.ppk,{big:true});});
  FM.cv.addEventListener('pointerup',()=>{drag=null;});
  drawMap(FM.cv,FM.la,FM.lo,FM.ppk,{big:true});renderDock();
}

/* Ergebnis */
function finishGame(win,reason){
  if(!G||G.done)return;G.done=true;G.running=false;stopLoop();FM=null;
  const ratio=G.driven/G.opt,st=win?(ratio<=1.08?3:ratio<=1.25?2:1):0;
  G.prevBest=G.mode==='level'?save.lv[G.idx]:null;
  if(G.mode==='level'&&win){save.stars[G.idx]=Math.max(save.stars[G.idx]||0,st);if(save.unlocked<G.idx+2)save.unlocked=Math.min(LEVELS.length,G.idx+2);
    const b=save.lv[G.idx];save.lv[G.idx]={ratio:Math.min(b?b.ratio:9,ratio),sec:Math.min(b?b.sec:1e9,G.elapsed)};}
  if(G.mode==='endless'){if(win){save.streak++;save.best=Math.max(save.best,save.streak);}else save.streak=0;}
  save.drives++;if(win)save.arrived++;save.totalKm+=G.driven;
  save.hist.push({s:G.startName,t:G.targetName,d:Date.now(),km:G.driven,opt:G.opt,st,win,sec:G.elapsed});if(save.hist.length>30)save.hist.shift();
  persist();G.result={win,reason,st,ratio};
  if(win){sfx('arrive');haptic();speak('Sie haben Ihr Ziel erreicht.');}else{sfx('fail');speak('Der Tank ist leer.');}
  vt(renderResult);
}
function resultView(cv){
  const pts=[...G.trail,...G.optPath.flatMap(e=>[[R.LA[e.from],R.LO[e.from]],[R.LA[e.to],R.LO[e.to]]]),[G.tLat,G.tLon]];
  const la0=Math.min(...pts.map(p=>p[0])),la1=Math.max(...pts.map(p=>p[0])),lo0=Math.min(...pts.map(p=>p[1])),lo1=Math.max(...pts.map(p=>p[1]));
  const cLa=(la0+la1)/2,cLo=(lo0+lo1)/2,wk=(lo1-lo0)*111.32*Math.cos(cLa*D2R)+2,hk=(la1-la0)*110.57+3;
  const d=cv._d||1,w=cv.width/d,h=cv.height/d;
  return {cLa,cLo,ppk:Math.max(1.5,Math.min(w/wk,(h-30)/hk)*0.88)};
}
function resMarkers(){return [{lat:G.trail[0][0],lon:G.trail[0][1],c:'#f5c400',t:G.startName},{lat:G.tLat,lon:G.tLon,c:'#ff8a2a',t:G.targetName,tc:'#1b0f03'}];}
function drawResult(cv,upTo){
  const v=resultView(cv);
  const keep=G.trail;if(upTo!==undefined)G.trail=keep.slice(0,Math.max(2,upTo));
  drawMap(cv,v.cLa,v.cLo,v.ppk,{optPath:upTo===undefined,noCar:true,big:true,markers:resMarkers()});
  if(upTo!==undefined&&G.trail.length>1){const ctx=cv.getContext('2d');const d=cv._d||1,w=cv.width/d,h=cv.height/d;const kx=111.32*Math.cos(v.cLa*D2R);const p=G.trail[G.trail.length-1],q=G.trail[G.trail.length-2];const x=w/2+(p[1]-v.cLo)*kx*v.ppk,y=h/2-(p[0]-v.cLa)*110.57*v.ppk;
    ctx.save();ctx.translate(x,y);ctx.rotate(bearing(q[0],q[1],p[0],p[1])*D2R);ctx.fillStyle='#fff';ctx.strokeStyle='#ff8a2a';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(8,9);ctx.lineTo(0,4);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
  G.trail=keep;
}

  const newBest=Rz.win&&G.mode==='level'&&(!pb||Rz.ratio<pb.ratio-1e-6);
  const head=Rz.win?`<div class="ort lg"><span>${esc(G.targetName)}</span></div><h1>Angekommen!</h1><div class="bigstars" role="img" aria-label="${Rz.st} von 3 Sternen">${[0,1,2].map(i=>STAR_SVG(i<Rz.st).replace('<svg ',`<svg style="animation-delay:${200+i*180}ms" `)).join('')}</div><p>${Rz.st===3?'Perfekte Route – kaum ein Meter zu viel.':Rz.st===2?'Guter Weg mit kleinem Umweg.':'Angekommen – aber mit Umwegen.'}</p>`
    :`<div class="failsign"><span>Liegengeblieben</span></div><h1>Nicht angekommen</h1><p>${G.mode==='endless'?'Deine Serie ist beendet.':'Der Tank war leer – versuch eine direktere Route.'}</p>`;
  const hasNext=G.mode==='level'&&Rz.win&&G.idx<LEVELS.length-1;
  app.innerHTML=`<main class="res"><div class="res-head">${head}</div>
    <div class="stats"><div class="stat"><b>${fmtKm(G.driven)}</b><span>gefahren</span></div><div class="stat"><b>${fmtKm(G.opt)}</b><span>Ideal-Route</span></div>
    <div class="stat"><b>${Rz.win?(det<=0?'0 %':'+'+det+' %'):'–'}</b><span>Umweg</span>${newBest?'<div class="best">Neuer Bestwert</div>':''}</div><div class="stat"><b>${G.mode==='endless'?save.streak+' / '+save.best:fmtTime(G.elapsed)}</b><span>${G.mode==='endless'?'Serie / Beste':'Fahrzeit'}</span></div></div>
    <div class="mapcard"><canvas id="rescv" aria-label="Karte deiner Fahrt"></canvas><button class="replay glass press" data-act="replay">${IC.replay} Replay</button><div class="legend"><span><i style="background:#ff6b1a"></i>Deine Fahrt</span><span><i style="background:#33b073"></i>Ideal-Route</span><span><i style="background:#e5484d;width:10px"></i>Sperrung</span></div></div>
    ${G.newSights.length?`<div class="chips">${G.newSights.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}
    <div class="rbtns">${G.mode==='level'?(hasNext?`<button class="btn btn-p press" data-act="next">Nächstes Level ${IC.arrowR}</button>`:'')+`<div class="rrow"><button class="btn btn-s press" data-act="retry">${IC.replay} Nochmal</button><button class="btn btn-s press" data-act="share">${IC.share} Teilen</button></div>`
      :`<button class="btn btn-p press" data-act="endless">Nächste Route ${IC.arrowR}</button><button class="btn btn-s press" data-act="share">${IC.share} Teilen</button>`}
      <button class="btn btn-g press" data-act="home">Zur Übersicht</button></div></main>`;
  const cv=document.getElementById('rescv');sizeCanvas(cv);drawResult(cv);setTimeout(replay,600);
  makeShareImage();try{window.scrollTo(0,0);}catch(e){}
}

/* =========================================================
   EVENTS
   ========================================================= */
function onOption(i){
  const dec=currentDecision();if(!dec)return;const op=dec.ops[i];if(!op||opClosed(op))return;
  hideCoach();G.tapI=i;
  if(G.stop==='choose'||G.stop==='start'){onTurn();take(op);return;}
  const key={x:dec.x,eIn:dec.eIn?dec.eIn.id:-1,i};
  if(G.q&&G.q.x===key.x&&G.q.eIn===key.eIn&&G.q.i===i){G.q=null;sfx('tap');}
  else if(op===contOpt(dec.eIn,dec.ops)){G.q=null;sfx('tap');}
  else{G.q=key;G.qSpoken=false;sfx('blink');haptic();}
  renderScene();renderDock();
}
function uturn(){
  if(G.stranded)return;onTurn();
  if(G.edge&&G.edge.rev>=0){const e=R.E[G.edge.rev];G.pos=e.len-G.pos;G.edge=e;G.path=[];G.q=null;G.turns++;lookahead();G.running=true;renderScene();renderDock();return;}
  if(G.decision&&G.decision.eIn&&G.decision.eIn.rev>=0){const e=R.E[G.decision.eIn.rev];G.edge=e;G.pos=0;G.path=[];G.stop=null;G.decision=null;G.atNode=null;G.q=null;G.turns++;lookahead();G.running=true;renderScene();renderDock();}
}
document.addEventListener('click',ev=>{
  audioUnlock();
  const el=ev.target.closest('[data-act],[data-op],[data-lvl],[data-tab],[data-seg]');if(!el||el.disabled)return;
  if(el.dataset.tab){resetArm=false;sfx('tap');haptic();const t=el.dataset.tab;vt(()=>{try{window.scrollTo(0,0);}catch(e){}renderHome(t);});return;}
  if(el.dataset.lvl!==undefined){resetArm=false;return startGame('level',+el.dataset.lvl);}
  if(el.dataset.op!==undefined)return onOption(+el.dataset.op);
  if(el.dataset.seg){const k=el.dataset.seg,v=el.dataset.v;if(k==='speed')save.speed=+v;else save.set[k]=v;persist();sfx('tap');return renderHome();}
  const a=el.dataset.act;
  switch(a){
    case 'closeov':{const ov=el.closest('.ov');const resume=ov&&ov.dataset.resume;closeOverlays();if(G){if(resume)G.running=true;G.lastT=performance.now();renderDock();if(G.stop==='start'&&!save.coached)setTimeout(showCoach,350);}return;}
    case 'navi':return showNavi();
    case 'play':if(G.stop)return;G.running=!G.running;G.lastT=performance.now();sfx('tap');return renderDock();
    case 'speed':save.speed=save.speed===1?1.6:save.speed===1.6?0.6:1;persist();sfx('tap');return renderDock();
    case 'uturn':return uturn();
    case 'refuel':{if(!G.fuelNear)return;const add=Math.min(G.fuelMax-G.fuel,Math.round(G.fuelMax*.3));G.fuel+=add;G.usedFuel.add(G.fuelNear.id);G.fuelNear=null;sfx('fuel');haptic();toast('+'+add+' km getankt','blue',IC.pump2);return renderDock();}
    case 'fullmap':return openFullMap();
    case 'closemap':return closeFullMap();
    case 'zin':FM.ppk=Math.min(80,FM.ppk*1.5);return drawMap(FM.cv,FM.la,FM.lo,FM.ppk,{big:true});
    case 'zout':FM.ppk=Math.max(1.2,FM.ppk/1.5);return drawMap(FM.cv,FM.la,FM.lo,FM.ppk,{big:true});
    case 'zcar':FM.follow=true;{const c=carPos();FM.la=c[0];FM.lo=c[1];}return drawMap(FM.cv,FM.la,FM.lo,FM.ppk,{big:true});
    case 'endless':resetArm=false;return startGame('endless');
    case 'next':return startGame('level',G.idx+1);
    case 'retry':if(LOADING)return startGame(LOADING.mode,LOADING.idx);return startGame(G.mode,G.idx);
    case 'home':LOADING=null;abortFetches();clearInterval(ldTimer);cancelAnimationFrame(replayRaf);return vt(()=>renderHome());
    case 'replay':return replay();
    case 'share':return doShare();
    case 'diag':return showDiag();
    case 'onboard':return showOnboarding();
    case 'onbnext':return onbNext();
    case 'onbdone':return onbDone();
    case 'clearcache':cacheClear().then(()=>{toast('Gespeicherte Regionen gelöscht');renderHome();});return;
    case 'quit':
      if(G.quitArm){if(G.mode==='endless'){save.streak=0;persist();}try{speechSynthesis.cancel();}catch(e){}return renderHome();}
      G.quitArm=true;el.classList.add('arm');toast(G.mode==='endless'?'Nochmal tippen zum Beenden – Serie endet':'Nochmal tippen zum Beenden');
      setTimeout(()=>{if(G&&G.quitArm){G.quitArm=false;const b=document.querySelector('[data-act=quit]');if(b)b.classList.remove('arm');}},2600);return;
    case 'speedcycle':return;
    case 'reset':
      if(!resetArm){resetArm=true;renderHome();setTimeout(()=>{if(resetArm){resetArm=false;if(!G&&!LOADING&&TAB==='settings')renderHome();}},3000);return;}
      resetArm=false;save=Object.assign({},save,{unlocked:1,stars:{},best:0,streak:0,sights:[],lv:{},hist:[],drives:0,arrived:0,totalKm:0});persist();renderHome();toast('Fortschritt zurückgesetzt');return;
  }
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset&&el.dataset.set){save.set[el.dataset.set]=el.checked;persist();audioUnlock();if(el.dataset.set==='sound'&&el.checked)sfx('sign');if(el.dataset.set==='voice'&&el.checked)speak('Sprachansage ist an.');if(el.dataset.set==='haptic'&&el.checked)haptic();}});
window.addEventListener('resize',()=>{const cv=document.getElementById('minicv');if(cv){sizeCanvas(cv);drawMini();}if(FM){sizeCanvas(FM.cv);drawMap(FM.cv,FM.la,FM.lo,FM.ppk,{big:true});}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.running){G.running=false;if(document.getElementById('dockbtns'))renderDock();}});
renderHome();
if(!save.onboarded)showOnboarding();

</script>
</body>
