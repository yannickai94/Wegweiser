<title>Abzweig</title>
<style>
:root{
  --asph:#141619;--asph2:#1e2125;--asph3:#2b2f34;--line:#353a40;
  --y:#f5c400;--blue:#0a5aa6;--wh:#f3f2ec;--brown:#6e4325;--ink:#101010;
  --txt:#ebe9e3;--mut:#979da4;--org:#ff6b1a;--grn:#33b073;--red:#e5484d;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --din:"DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --sky1:#4f8fcc;--sky2:#cfe3f3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--asph);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#app{min-height:100dvh}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes lane{to{stroke-dashoffset:-64}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--org)}50%{box-shadow:0 0 0 7px rgba(255,107,26,.45)}}

/* ---------- Home ---------- */
.home{min-height:100dvh;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 30px);background:radial-gradient(120% 60% at 50% 0%,#24282d 0%,var(--asph) 60%)}
.logo{background:var(--y);border-radius:16px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:pop .4s ease both}
.logo-in{border:3px solid var(--ink);border-radius:11px;padding:14px 16px;color:var(--ink);display:flex;align-items:center;gap:14px}
.logo svg{width:54px;height:54px;flex:none}
.logo h1{font-family:var(--din);font-size:42px;letter-spacing:1.5px;line-height:1}
.logo p{font-size:13.5px;font-weight:600;opacity:.78;margin-top:5px;line-height:1.3}
.sec{margin-top:26px}
.sec h2{font-family:var(--din);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 span{letter-spacing:0;text-transform:none;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{background:var(--y);color:var(--ink);border-radius:11px;padding:4px;text-align:left;transition:transform .12s}
.lv:active{transform:scale(.97)}
.lv-in{border:2px solid var(--ink);border-radius:8px;padding:8px 10px;min-height:108px;display:flex;flex-direction:column;gap:1px}
.lv .no{font-family:var(--din);font-size:12px;letter-spacing:1px;opacity:.65;display:flex;justify-content:space-between}
.lv .a,.lv .b{font-family:var(--din);font-size:18px;line-height:1.08;overflow-wrap:anywhere}
.lv .via{font-size:13px;line-height:1;opacity:.6}
.lv .st{margin-top:auto;font-size:15px;letter-spacing:2px;padding-top:4px}
.lv .st i{font-style:normal;opacity:.25}
.lv.locked{background:var(--asph3);color:#5d6268}
.lv.locked .lv-in{border-color:#41464c}
.lv.next{animation:pulse 1.8s ease-in-out infinite}
.lv.far{background:var(--blue);color:#fff}.lv.far .lv-in{border-color:#fff}
.lv.far.locked{background:var(--asph3);color:#5d6268}.lv.far.locked .lv-in{border-color:#41464c}
.endless{background:var(--blue);color:#fff;border-radius:13px;padding:5px;width:100%;text-align:left}
.endless-in{border:2.5px solid #fff;border-radius:9px;padding:14px;display:flex;align-items:center;gap:14px}
.endless b{font-family:var(--din);font-size:22px;display:block;font-weight:400}
.endless small{font-size:13px;opacity:.85}
.endless.locked{background:var(--asph3);color:#666}.endless.locked .endless-in{border-color:#444}
.shield{background:var(--blue);color:#fff;font-family:var(--din);font-size:20px;padding:6px 10px;border-radius:8px;box-shadow:inset 0 0 0 2.5px #fff;flex:none}
.album{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--brown);color:#fff;font-family:var(--din);font-size:13px;padding:6px 9px;border-radius:6px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85)}
.chip.no{background:var(--asph3);color:#5d6268;box-shadow:inset 0 0 0 1.5px #41464c}
.reset{margin-top:30px;color:var(--mut);font-size:13px;width:100%;padding:10px}
.reset.arm{color:var(--red);font-weight:700}

/* ---------- Game ---------- */
.game{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.hud{background:var(--asph);padding:calc(var(--st) + 8px) 12px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line);z-index:5}
.hud-top{display:flex;align-items:center;gap:10px}
.ib{width:38px;height:38px;border-radius:11px;background:var(--asph3);display:grid;place-items:center;flex:none}
.ib svg{width:18px;height:18px}
.ib.arm{background:var(--red)}
.ziel{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.ziel small{font-size:10.5px;color:var(--mut);letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
.ort{background:var(--y);color:var(--ink);font-family:var(--din);border-radius:6px;padding:3px;display:inline-block;max-width:100%;min-width:0}
.ort>span{display:block;border:2px solid var(--ink);border-radius:4px;padding:3px 10px 2px;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navi{background:var(--asph3);border-radius:11px;height:38px;padding:0 11px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;flex:none}
.navi svg{width:17px;height:17px}
.navi[disabled]{opacity:.35}
.tank{display:flex;align-items:center;gap:9px;font-size:13px;font-variant-numeric:tabular-nums}
.tank svg{width:17px;height:17px;flex:none;color:var(--mut)}
.bar{flex:1;height:10px;background:var(--asph3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .6s ease,background .6s}
.tank b{min-width:70px;text-align:right}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}

.scene{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 78%,#b9c7a5 100%)}
.scene-in{position:relative;min-height:100%;padding:16px 14px calc(var(--sb) + 170px);display:flex;flex-direction:column;align-items:center;gap:12px}
.trees{position:absolute;left:0;right:0;bottom:0;height:260px;pointer-events:none;z-index:0;opacity:.55}
.trees svg{width:100%;height:100%}
.ground{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,#7d6a45,#4f4430);z-index:0}
.posts{position:absolute;top:70px;bottom:40px;left:50%;width:min(440px,calc(100% - 28px));transform:translateX(-50%);pointer-events:none;z-index:1}
.posts i{position:absolute;top:0;bottom:0;width:9px;border-radius:2px;background:linear-gradient(90deg,#7d838a,#dfe3e7 45%,#737980)}
.posts.two i:first-child{left:22%}.posts.two i:last-child{right:22%}
.posts.one i{left:calc(50% - 5px)}
.here{position:relative;z-index:2;text-align:center}
.here small{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);margin-bottom:5px}
.ortstafel{background:var(--y);color:var(--ink);border-radius:9px;padding:5px;box-shadow:0 8px 20px rgba(0,0,0,.25);display:inline-block}
.ortstafel>span{display:block;border:3px solid var(--ink);border-radius:6px;padding:8px 22px 6px;font-family:var(--din);font-size:30px;line-height:1}
.ortstafel.blue{background:var(--blue);color:#fff}.ortstafel.blue>span{border-color:#fff;font-size:26px}
.ortstafel.blue em{display:block;font-style:normal;font-size:13px;letter-spacing:1px;margin-bottom:4px;opacity:.9}
.note{position:relative;z-index:2;font-size:12.5px;color:#fff;background:rgba(10,20,35,.45);padding:6px 11px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center}
.unter{position:relative;z-index:2;background:var(--brown);color:#fff;border-radius:10px;padding:4px;max-width:330px;width:100%;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.unter>div{border:2.5px solid #fff;border-radius:7px;padding:8px 10px;display:flex;align-items:center;gap:12px}
.unter svg{width:36px;height:36px;flex:none}
.unter b{font-family:var(--din);font-size:21px;font-weight:400;line-height:1.1}
.anim{animation:pop .35s ease both}

/* Pfeilwegweiser */
.mast{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;max-width:430px}
.grp{display:flex;flex-direction:column;gap:5px;width:100%}
.grp.L{align-items:flex-start}.grp.R{align-items:flex-end}.grp.S{align-items:center}
.pw{position:relative;width:94%;text-align:left;--tip:30px;filter:drop-shadow(0 6px 9px rgba(0,0,0,.25));transition:transform .12s}
.pw:active{transform:scale(.98)}
.pw.small{width:84%;--tip:22px}.pw.small .nm{font-size:18px}
.pw .o,.pw .m,.pw .i{clip-path:var(--cp)}
.pw .o{padding:4px;background:var(--bg)}
.pw .m{padding:2.5px;background:var(--fg)}
.pw .i{background:var(--bg);color:var(--fg);padding:8px 12px;display:flex;align-items:center;gap:10px;min-height:52px}
.pw.R{--cp:polygon(0 0,calc(100% - var(--tip)) 0,100% 50%,calc(100% - var(--tip)) 100%,0 100%)}
.pw.R .i{padding-right:calc(var(--tip) + 6px)}
.pw.L{--cp:polygon(var(--tip) 0,100% 0,100% 100%,var(--tip) 100%,0 50%)}
.pw.L .i{padding-left:calc(var(--tip) + 6px)}
.pw.S{--cp:inset(0 round 7px)}
.pw.S .arr{width:30px;height:30px}
.c-y{--bg:var(--y);--fg:var(--ink)}.c-b{--bg:var(--blue);--fg:#fff}.c-w{--bg:var(--wh);--fg:var(--ink)}.c-br{--bg:var(--brown);--fg:#fff}
.pw.sel{filter:drop-shadow(0 0 2px var(--org)) drop-shadow(0 0 2px var(--org)) drop-shadow(0 0 3px var(--org))}
.pw.sel .i{box-shadow:inset 0 0 0 200px rgba(255,107,26,.14)}
.names{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{display:flex;align-items:baseline;gap:8px;font-family:var(--din);font-size:21px;line-height:1.08}
.nm span{flex:1;min-width:0;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.nm em{font-style:normal;font-size:16px;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.bd{font-family:var(--din);font-size:15px;padding:3px 7px 2px;border-radius:5px;flex:none;white-space:nowrap;align-self:center;line-height:1.1}
.bd-a{background:var(--blue);color:#fff;box-shadow:inset 0 0 0 2px #fff,0 0 0 1px var(--blue)}
.bd-b{background:var(--y);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.bds{display:flex;flex-direction:column;gap:4px;flex:none}
.pic{width:30px;height:30px;flex:none;border-radius:5px;display:grid;place-items:center}
.pic svg{width:22px;height:22px}
.pic.br{background:var(--brown);box-shadow:inset 0 0 0 1.5px #fff}
.pic.bl{background:var(--blue);box-shadow:inset 0 0 0 1.5px #fff}
.pw.info{pointer-events:none}
.svc{display:flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border-radius:7px;padding:4px 9px 4px 4px;font-family:var(--din);font-size:16px;box-shadow:inset 0 0 0 2px #fff,0 6px 10px rgba(0,0,0,.2)}
.svc .pic{width:28px;height:28px;background:#fff;color:var(--blue);box-shadow:none}
.svc .arr{width:20px;height:20px}
.gesperrt{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(-45deg,rgba(229,72,77,.78) 0 14px,rgba(255,255,255,.7) 14px 28px);border-radius:8px;pointer-events:none}
.gesperrt b{background:#fff;color:var(--red);font-family:var(--din);font-size:17px;padding:4px 10px;border-radius:5px;border:2.5px solid var(--red);font-weight:400;letter-spacing:1px}
.pw .gesperrt{clip-path:var(--cp);border-radius:0}

/* Vorwegweiser */
.vw{position:relative;z-index:2;width:100%;max-width:440px;background:var(--y);color:var(--ink);border-radius:12px;padding:5px;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.vw.white{background:var(--wh)}
.vw-in{position:relative;border:3px solid var(--ink);border-radius:8px;height:420px}
.vw .head{position:absolute;left:10px;top:8px;font-family:var(--din);font-size:22px}
.vw svg.dia{position:absolute;inset:0;width:100%;height:100%}
.vb{position:absolute;text-align:left;border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;color:var(--ink);transition:transform .12s;max-width:48%}
.vb:active{transform:scale(.97)}
.vb .vn{font-family:var(--din);font-size:21px;line-height:1.05;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.vb .row2{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.vb.S{top:10px;left:50%;transform:translateX(-50%);align-items:center;text-align:center;max-width:60%}
.vb.S:active{transform:translateX(-50%) scale(.97)}
.vb.L{left:8px;top:232px;max-width:44%}
.vb.R{right:8px;top:232px;max-width:44%;align-items:flex-end;text-align:right}
.vb.R .row2{justify-content:flex-end}
.vb.auto{background:var(--blue);color:#fff;box-shadow:inset 0 0 0 2px #fff}
.vb.sel{box-shadow:0 0 0 4px var(--org);background:rgba(255,107,26,.18)}
.vb.auto.sel{box-shadow:inset 0 0 0 2px #fff,0 0 0 4px var(--org);background:#0c4f91}
.vb .gesperrt{border-radius:7px}

/* Autobahn */
.ab{position:relative;z-index:2;width:100%;max-width:440px;background:var(--blue);color:#fff;border-radius:12px;padding:5px;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.ab-in{border:3px solid #fff;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px}
.ab-h{font-family:var(--din);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 6px}
.abr{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:7px;text-align:left;min-height:58px;width:100%;position:relative}
.abr+.abr{border-top:2px solid rgba(255,255,255,.85);border-radius:0 0 7px 7px}
.abr.sel{box-shadow:0 0 0 4px var(--org);background:#0c4f91;border-radius:7px}
.abr.rt .arr{order:3}
.arr{width:40px;height:40px;flex:none}

.umleit{position:relative;z-index:2;display:flex;align-items:center;gap:10px;background:var(--y);color:var(--ink);border-radius:9px;padding:4px;box-shadow:0 8px 18px rgba(0,0,0,.25);max-width:330px}
.umleit>div{border:2.5px solid var(--ink);border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:10px}
.umleit .u{font-family:var(--din);font-size:26px;font-weight:700;border:2.5px solid var(--ink);border-radius:5px;padding:0 7px}
.umleit .arr{width:32px;height:32px}
.umleit small{font-size:12.5px;font-weight:600;line-height:1.25}

.dock{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(var(--sb) + 12px);background:rgba(20,22,25,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:10px;z-index:6;border-top:1px solid var(--line)}
.dock .chips{display:flex;gap:8px;flex-wrap:wrap}
.dock .chips:empty{display:none}
.dchip{background:var(--asph3);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.dchip svg{width:15px;height:15px}
.dchip.fuel{background:var(--blue);color:#fff}
.dock .main{display:flex;gap:12px;align-items:center}
.dock .info{flex:1;min-width:0;font-size:14px;line-height:1.35}
.dock .hint{color:var(--mut)}
.warn{color:var(--red);font-weight:700;display:block}
.go{background:var(--org);color:#fff;font-weight:800;font-size:17px;padding:14px 20px;border-radius:14px;flex:none;display:flex;gap:6px;align-items:center}
.go svg{width:18px;height:18px}
.go[disabled]{background:var(--asph3);color:#666}

/* ---------- Overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(8,9,10,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:20;animation:fade .2s}
.card{background:var(--asph2);border-radius:22px;padding:22px 20px 20px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .3s ease both;border:1px solid var(--line)}
.card .lvl{font-family:var(--din);font-size:13px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;text-align:center}
.route{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0 16px}
.route .ort>span{font-size:24px;padding:6px 16px 4px}
.route svg{width:22px;height:22px;color:var(--mut)}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.facts div{background:var(--asph3);border-radius:14px;padding:11px 6px;text-align:center}
.facts b{display:block;font-family:var(--din);font-size:22px;font-weight:400}
.facts span{font-size:11.5px;color:var(--mut)}
.tip{font-size:14px;line-height:1.45;color:#c9c7c1;margin:16px 2px 18px}
.primary{width:100%;background:var(--org);color:#fff;font-weight:800;font-size:17px;padding:15px;border-radius:15px}
.secondary{width:100%;background:var(--asph3);color:var(--txt);font-weight:700;font-size:16px;padding:14px;border-radius:15px}
.compass{width:190px;height:190px;margin:6px auto 12px;display:block}
.c-txt{text-align:center;font-size:15px;line-height:1.45}
.c-txt b{font-family:var(--din);font-size:26px;font-weight:400;display:block}

.drive{position:fixed;inset:0;z-index:30;background:#0d0f11;display:flex;flex-direction:column;animation:fade .2s}
.drive svg.road{flex:1;width:100%}
.drive-top{position:absolute;top:calc(var(--st) + 24px);left:0;right:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.drive-top .to{font-family:var(--din);font-size:28px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.drive-bot{position:absolute;bottom:calc(var(--sb) + 34px);left:0;right:0;text-align:center}
.odo{display:inline-block;background:#000;color:#ffd24d;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:30px;padding:8px 16px;border-radius:10px;letter-spacing:2px;box-shadow:inset 0 0 0 2px #333;font-variant-numeric:tabular-nums}
.skip{display:block;margin-top:12px;font-size:12px;color:#777}
.lane{animation:lane .3s linear infinite}
.drive.slow .lane{animation-duration:1.2s}
.empty{font-family:var(--din);font-size:30px;color:var(--red);margin-bottom:12px}

.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 150px);transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.8);animation:fade .25s ease;max-width:88vw;text-align:center}
.toast.dark{background:var(--asph3);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.blue{background:var(--blue)}

/* ---------- Result ---------- */
.res{min-height:100dvh;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 26px)}
.res-head{text-align:center;animation:pop .4s ease both}
.res-head h1{font-family:var(--din);font-size:36px;font-weight:400;margin-top:12px}
.res-head p{color:var(--mut);font-size:14px;margin-top:4px}
.stars{font-size:38px;letter-spacing:6px;margin-top:6px;color:var(--y)}
.stars i{font-style:normal;color:#3a3f45}
.failsign{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:5px}
.failsign span{display:block;border:3px solid #fff;border-radius:7px;padding:8px 18px 6px;font-family:var(--din);font-size:24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.stats div{background:var(--asph2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats b{display:block;font-family:var(--din);font-size:24px;font-weight:400}
.stats span{font-size:12px;color:var(--mut)}
.mapbox{margin-top:16px;background:#101215;border:1px solid var(--line);border-radius:18px;padding:8px;overflow:hidden}
.mapbox svg{width:100%;height:auto;display:block;border-radius:12px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mut);padding:8px 0 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.trail{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px;font-size:13px;align-items:center}
.trail span{background:var(--asph3);padding:4px 8px;border-radius:7px}
.trail span.t{background:var(--y);color:var(--ink);font-weight:700}
.trail em{font-style:normal;color:var(--mut)}
.btns{display:grid;gap:10px;margin-top:22px}
</style>

const N={},ADJ={},EDGES=[];
NODE_DATA.split('\n').forEach(l=>{

const rad=d=>d*Math.PI/180;
function hav(a,b){const R=6371,dLa=rad(b.lat-a.lat),dLo=rad(b.lon-a.lon);const x=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b){const p1=rad(a.lat),p2=rad(b.lat),dl=rad(b.lon-a.lon);const y=Math.sin(dl)*Math.cos(p2);const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (Math.atan2(y,x)*180/Math.PI+360)%360;}
const SEEN_PAIR={};
ROAD_DATA.split('\n').map(l=>l.trim()).filter(l=>l.includes('|')).forEach(l=>{
  const [road,chain]=l.split('|');
  const names=chain.split(',').map(s=>s.trim());
  for(let i=0;i<names.length-1;i++){
    const a=names[i],b=names[i+1];
    if(!N[a]||!N[b]) throw new Error('Ort fehlt: '+a+' / '+b);
    const type=road.trim()[0];
    const key=[a,b].sort().join('|')+type; if(SEEN_PAIR[key]) continue; SEEN_PAIR[key]=1;
    const f=type==='A'?1.17:type==='B'?1.25:1.3;
    const km=Math.max(3,Math.round(hav(N[a],N[b])*f));
    const e={id:EDGES.length,road:road.trim(),type,a,b,km};
    EDGES.push(e);ADJ[a].push({e,to:b});ADJ[b].push({e,to:a});
  }
});
const KEYS=Object.keys(N);
let CLOSED=new Set(), DC={};
function dj(src,ban){
  const key=src+'|'+(ban||'');if(DC[key])return DC[key];
  const dist={},prev={},done={};for(const k of KEYS)dist[k]=Infinity;dist[src]=0;
  for(;;){
    let u=null,b=Infinity;for(const k of KEYS){if(!done[k]&&dist[k]<b){b=dist[k];u=k;}}
    if(u===null)break;done[u]=1;
    for(const {e,to} of ADJ[u]){if(to===ban||CLOSED.has(e.id))continue;const nd=dist[u]+e.km;if(nd<dist[to]){dist[to]=nd;prev[to]={u,e};}}
  }
  return DC[key]={dist,prev};
}
function pathTo(D,t){const p=[t];let c=t;while(D.prev[c]){c=D.prev[c].u;p.unshift(c);}return p;}
function setClosed(s){CLOSED=s;DC={};}

const REGION_KEYS=KEYS.filter(k=>N[k].lat>51.35&&N[k].lat<52.25&&N[k].lon>6.4&&N[k].lon<8.4);
function randomPair(){
  setClosed(new Set());
  const far=Math.random()<.3;
  for(let i=0;i<900;i++){
    const pool=far?KEYS:REGION_KEYS;
    const s=REGION_KEYS[rnd(REGION_KEYS.length)],t=pool[rnd(pool.length)];
    if(s===t)continue;const d=dj(s).dist[t];
    if(far?(d>=200&&d<=500):(d>=30&&d<=110))return [s,t];
  }
  return ['Lünen','Münster'];
}
function pickClosures(s,t,count){
  setClosed(new Set());
  if(!count) return new Set();
  const opt=pathTo(dj(s),t), onPath=new Set(opt);
  const cand=EDGES.filter(e=>(onPath.has(e.a)||onPath.has(e.b))&&e.a!==s&&e.b!==s);
  for(let tries=0;tries<60;tries++){
    const set=new Set();
    const pathEdges=cand.filter(e=>{const i=opt.indexOf(e.a),j=opt.indexOf(e.b);return i>=0&&j>=0&&Math.abs(i-j)===1;});
    if(pathEdges.length) set.add(pathEdges[rnd(pathEdges.length)].id);
    while(set.size<count&&set.size<cand.length) set.add(cand[rnd(cand.length)].id);
    setClosed(set);
    if(isFinite(dj(s).dist[t])) return set;
  }
  setClosed(new Set());return new Set();
}
function startGame(mode,idx){
  let s,t,f,j,c,tip;
  if(mode==='level'){({s,t,f,j,c,tip}=LEVELS[idx]);}
  else{[s,t]=randomPair();f=1.4;j=2;c=2;tip='Zufällige Route. Jede Ankunft verlängert deine Serie – liegenbleiben setzt sie zurück.';}
  const closed=pickClosures(s,t,c);
  const D=dj(s),opt=D.dist[t],fuel=Math.ceil(opt*f);
  G={mode,idx,start:s,target:t,cur:s,heading:null,arrType:null,lastEdge:null,fuelMax:fuel,fuel,driven:0,opt,optPath:pathTo(D,t),
     path:[s],turns:0,jokers:j,sel:null,sub:null,newSights:[],stranded:null,tip,quitArm:false,closed,usedStations:new Set(),refuels:0};
  const ns=ADJ[s].filter(x=>!CLOSED.has(x.e.id));

}

/* =========================================================
   SCHILDLOGIK
   ========================================================= */
function edgeInfo(cur,e,to){
  const Dc=dj(cur),Dt=dj(to,cur),T=G.target,via=k=>e.km+Dt.dist[k];
  const cand=KEYS.filter(k=>k!==cur&&k!==to&&isFinite(Dt.dist[k])&&via(k)<=Dc.dist[k]*1.03+1);
  const names=[{n:to,km:e.km}];
  if(T!==to&&cand.includes(T)){const v=via(T),tt=N[T].tier;if(v<=(tt===1?120:tt===2?60:28))names.push({n:T,km:v});}
  const pick=f=>{let best=null;for(const k of cand){if(k===T||names.some(x=>x.n===k)||!f(k))continue;const v=via(k);if(!best||v<best.km)best={n:k,km:v};}if(best)names.push(best);};
  if(names.length<3)pick(k=>N[k].tier===1&&via(k)<=400);
  if(names.length<3)pick(k=>N[k].tier===2&&via(k)<=70);
  names.sort((a,b)=>a.km-b.km);
  let sight=null,station=null;
  const sc=[to,...cand];
  for(const k of sc){const v=k===to?e.km:via(k);
    if(N[k].sight&&v<=30&&(!sight||v<sight.km))sight={n:N[k].sight,km:v};
    if(N[k].station&&!G.usedStations.has(k)&&v<=25&&(!station||v<station.km))station={n:k,km:v};}
  const rel=((bearing(N[cur],N[to])-G.heading+540)%360)-180;
  return {e,to,names,sight,station,rel,closed:CLOSED.has(e.id)};
}
function sectorOf(r){return r<-30?'L':r>30?'R':'S';}
function assign(sorted){
  if(sorted.length===3)return ['L','S','R'].map((s,i)=>({slot:s,opts:[sorted[i]]}));
  if(sorted.length===1)return [{slot:sectorOf(sorted[0].rel),opts:sorted}];
  const [a,b]=sorted;let sa=sectorOf(a.rel),sb=sectorOf(b.rel);
  if(sa===sb){if(sa==='S'){if(a.rel+b.rel>0)sb='R';else sa='L';}else if(sa==='R')sa='S';else sb='S';}
  return [{slot:sa,opts:[a]},{slot:sb,opts:[b]}];
}
function layout(opts){
  const sorted=opts.slice().sort((a,b)=>a.rel-b.rel);
  if(sorted.length<=3)return assign(sorted);
  const g={L:[],S:[],R:[]};sorted.forEach(o=>g[sectorOf(o.rel)].push(o));
  let groups=['L','S','R'].filter(k=>g[k].length).map(k=>({slot:k,opts:g[k]}));
  if(groups.length===1){const c=Math.ceil(sorted.length/3);groups=[{slot:'L',opts:sorted.slice(0,c)},{slot:'S',opts:sorted.slice(c,2*c)},{slot:'R',opts:sorted.slice(2*c)}].filter(x=>x.opts.length);}
  return groups;
}
function itemData(it){
  const ops=it.opts;
  if(ops.length===1){const o=ops[0];return {names:o.names,roads:[o.e],sight:o.sight,station:o.station,closed:o.closed};}
  const all=[];ops.filter(o=>!o.closed).forEach(o=>o.names.forEach(n=>{if(!all.some(x=>x.n===n.n))all.push(n);}));
  const T=G.target;
  all.sort((a,b)=>(b.n===T)-(a.n===T)||N[a.n].tier-N[b.n].tier||a.km-b.km);
  const names=all.slice(0,3).sort((a,b)=>a.km-b.km);
  const roads=[];ops.forEach(o=>{if(o.e.type!=='L'&&!roads.some(r=>r.road===o.e.road))roads.push(o.e);});
  roads.sort((a,b)=>(a.type==='A'?0:1)-(b.type==='A'?0:1));
  const best=(k)=>ops.map(o=>o[k]).filter(Boolean).sort((a,b)=>a.km-b.km)[0]||null;
  return {names,roads:roads.slice(0,2),sight:best('sight'),station:best('station'),closed:ops.every(o=>o.closed),group:true};
}
function computeOptions(){
  const cur=G.cur;
  G.opts=ADJ[cur].map(({e,to})=>edgeInfo(cur,e,to));
  G.opts.forEach((o,i)=>o.i=i);
  let fwd=G.opts.filter(o=>G.lastEdge===null||o.e.id!==G.lastEdge);
  if(!fwd.length)fwd=G.opts.slice();
  G.fwd=fwd;
  buildItems();
}
function buildItems(){
  const base=G.sub||G.fwd;
  G.items=layout(base).map((it,i)=>Object.assign(it,itemData(it),{k:i}));
  const ord={S:0,L:1,R:2};G.items.sort((a,b)=>ord[a.slot]-ord[b.slot]);G.items.forEach((it,i)=>it.k=i);
  const bestFor={};G.items.forEach(it=>{if(it.closed)return;it.names.forEach(n=>{if(!bestFor[n.n]||n.km<bestFor[n.n].km)bestFor[n.n]={km:n.km,k:it.k};});});
  G.items.forEach(it=>{if(it.closed)return;const kept=it.names.filter(n=>bestFor[n.n].k===it.k);it.names=kept.length?kept:it.names.slice(0,1);});
  const fuelLow=G.fuel/G.fuelMax<.7;G.items.forEach(it=>{if(!fuelLow)it.station=null;if(it.sight&&it.sight.km>20)it.sight=null;});
  G.sel=null;
}
function signKind(){
  if(G.sub)return 'pfeil-w';
  if(G.arrType==='A'&&!G.startHeading)return 'auto';
  return N[G.cur].tier<=2?'vor':'pfeil';
}

const GESPERRT=`<div class="gesperrt"><b>GESPERRT</b></div>`;
function pfeilHTML(white){

function drive(o){

    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wide?'#3f78b3':'#5b8fc0'}"/><stop offset="1" stop-color="#d9e6ef"/></linearGradient></defs>
    <rect width="400" height="300" fill="url(#sk)"/><rect y="300" width="400" height="300" fill="#4f5a3a"/>
    <path d="M0 300 Q60 270 120 290 T260 284 T400 292 V300 H0z" fill="#6b7a55" opacity=".7"/>

    ${wide?'<polygon points="181,300 184,300 0,600 -16,600" fill="#e9e9e9" opacity=".8"/><polygon points="216,300 219,300 416,600 400,600" fill="#e9e9e9" opacity=".8"/>':''}
    <line class="lane" x1="200" y1="300" x2="200" y2="600" stroke="#f0f0f0" stroke-width="${wide?7:5}" stroke-dasharray="26 38"/></svg>

  document.body.appendChild(dv);

  const step=ts=>{if(t0===null)t0=ts;const p=Math.min(1,(ts-t0)/dur);odo.textContent=Math.round(km*(1-Math.pow(1-p,2)))+' km';if(p<1)raf=requestAnimationFrame(step);else fin();};

function arrive(o,km,strand){

  G.cur=o.to;G.path.push(o.to);G.sub=null;G.quitArm=false;

  persist();G.result={win,reason,st,ratio};renderResult();

/* =========================================================

const P=(lat,lon)=>[(lon-5.7)*63,(55.15-lat)*100];
const Pn=k=>P(N[k].lat,N[k].lon);
function mapSVG(){
  const pts=G.path.map(Pn);
  if(G.stranded){const a=N[G.stranded.from],b=N[G.stranded.to],f=G.stranded.frac;pts.push(P(a.lat+(b.lat-a.lat)*f,a.lon+(b.lon-a.lon)*f));}

  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));

  const cx=(x0+x1)/2,cy=(y0+y1)/2,vx=cx-w/2,vy=cy-h/2,z=w/600;
  const inView=p=>p[0]>=vx-5&&p[0]<=vx+w+5&&p[1]>=vy-5&&p[1]<=vy+h+5;
  const f=n=>n.toFixed(2);
  const ol=OUTLINE.map(([lo,la])=>P(la,lo).map(f).join(',')).join(' ');
  const edges=EDGES.map(e=>{const a=Pn(e.a),b=Pn(e.b);if(!inView(a)&&!inView(b))return '';
    const col=e.type==='A'?'#3b5f86':e.type==='B'?'#6b5f35':'#3e4246';const sw=(e.type==='A'?2.6:e.type==='B'?1.8:1.3)*z;
    let s=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${col}" stroke-width="${sw}"/>`;
    if(CLOSED.has(e.id)){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,r=7*z;s+=`<g stroke="#e5484d" stroke-width="${3*z}" stroke-linecap="round"><line x1="${f(mx-r)}" y1="${f(my-r)}" x2="${f(mx+r)}" y2="${f(my+r)}"/><line x1="${f(mx-r)}" y1="${f(my+r)}" x2="${f(mx+r)}" y2="${f(my-r)}"/></g>`;}
    return s;}).join('');
  const lblTier=z<.25?3:z<.55?2:1;
  const dots=KEYS.map(k=>{const p=Pn(k);if(!inView(p))return '';const show=N[k].tier<=lblTier&&k!==G.start&&k!==G.target;
    return `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${(N[k].tier===1?3.6:2.6)*z}" fill="#6f757c"/>${show?`<text x="${f(p[0]+5*z)}" y="${f(p[1]+4*z)}" fill="#7d838a" font-size="${f(12*z)}" font-family="-apple-system,sans-serif">${esc(k)}</text>`:''}`;}).join('');
  const optPts=G.optPath.map(k=>Pn(k).map(f).join(',')).join(' '),myPts=pts.map(p=>p.map(f).join(',')).join(' ');
  const s=Pn(G.start),t=Pn(G.target),end=pts[pts.length-1];
  const tag=(p,txt,bg,fg)=>{const fs=15*z,tw=(txt.length*8.6+16)*z,th=24*z;let x=p[0]-tw/2;x=Math.max(vx+4*z,Math.min(vx+w-tw-4*z,x));const y=p[1]-th-12*z;
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(tw)}" height="${f(th)}" rx="${f(5*z)}" fill="${bg}" stroke="#101010" stroke-width="${f(2*z)}"/><text x="${f(x+tw/2)}" y="${f(y+th*0.72)}" text-anchor="middle" font-size="${f(fs)}" font-weight="700" fill="${fg}" font-family="-apple-system,sans-serif">${esc(txt)}</text>`;};
  return `<svg viewBox="${f(vx)} ${f(vy)} ${f(w)} ${f(h)}"><rect x="${f(vx)}" y="${f(vy)}" width="${f(w)}" height="${f(h)}" fill="#101215"/>
    <polygon points="${ol}" fill="#1b1f23" stroke="#3a4047" stroke-width="${f(2.5*z)}" stroke-linejoin="round"/>${edges}${dots}
    <polyline points="${optPts}" fill="none" stroke="#33b073" stroke-width="${f(4*z)}" stroke-dasharray="${f(9*z)} ${f(7*z)}" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${myPts}" fill="none" stroke="#101010" stroke-width="${f(9*z)}" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${myPts}" fill="none" stroke="#f5c400" stroke-width="${f(5*z)}" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${f(s[0])}" cy="${f(s[1])}" r="${f(8*z)}" fill="#f5c400" stroke="#101010" stroke-width="${f(3*z)}"/>
    <circle cx="${f(t[0])}" cy="${f(t[1])}" r="${f(9*z)}" fill="#ff6b1a" stroke="#fff" stroke-width="${f(3*z)}"/>
    ${G.result.win?'':`<circle cx="${f(end[0])}" cy="${f(end[1])}" r="${f(8*z)}" fill="#e5484d" stroke="#fff" stroke-width="${f(3*z)}"/>`}

function renderResult(){
  const R=G.result,detour=Math.round((R.ratio-1)*100);
  const head=R.win
    ?`<div class="ortstafel"><span>${esc(G.target)}</span></div><h1>Angekommen!</h1><div class="stars">${starStr(R.st)}</div><p>${R.st===3?'Perfekte Route.':R.st===2?'Guter Weg mit kleinem Umweg.':'Angekommen – aber mit Umwegen.'}</p>`
    :`<div class="failsign"><span>${R.reason==='stranded'?'Liegengeblieben':'Tank leer'}</span></div><h1>Nicht angekommen</h1><p>${G.mode==='endless'?'Deine Serie ist beendet.':'Versuch eine direktere Route.'}</p>`;
  const trail=G.path.map((k,i)=>`<span class="${k===G.target?'t':''}">${esc(k)}</span>${i<G.path.length-1?'<em>›</em>':''}`).join('');
  const hasNext=G.mode==='level'&&R.win&&G.idx<LEVELS.length-1;
  const btns=G.mode==='level'
    ?`${hasNext?`<button class="primary" data-act="next">Nächstes Level</button>`:''}<button class="${hasNext?'secondary':'primary'}" data-act="retry">${R.win?'Nochmal fahren':'Nochmal versuchen'}</button><button class="secondary" data-act="home">Übersicht</button>`
    :`<button class="primary" data-act="endless">Nächste Route</button><button class="secondary" data-act="home">Übersicht</button>`;
  app.innerHTML=`<div class="res"><div class="res-head">${head}</div>
    <div class="stats"><div><b>${Math.round(G.driven)} km</b><span>gefahren</span></div><div><b>${Math.round(G.opt)} km</b><span>Ideal-Route</span></div>
    <div><b>${R.win?(detour<=0?'0 %':'+'+detour+' %'):'–'}</b><span>Umweg</span></div><div><b>${G.mode==='endless'?save.streak+' / '+save.best:G.turns}</b><span>${G.mode==='endless'?'Serie / Beste':'Abzweigungen'}</span></div></div>
    <div class="mapbox">${mapSVG()}<div class="legend"><span><i style="background:#f5c400"></i>Deine Fahrt</span><span><i style="background:#33b073"></i>Ideal-Route</span><span><i style="background:#e5484d;width:10px"></i>Sperrung</span></div></div>
    <div class="trail">${trail}</div>
    ${G.newSights.length?`<div class="trail" style="margin-top:10px">${G.newSights.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}
    <div class="btns">${btns}</div></div>`;
  try{window.scrollTo(0,0);}catch(e){}
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act],[data-item],[data-lvl]');if(!el||el.disabled)return;
  if(el.dataset.lvl!==undefined){resetArm=false;return startGame('level',+el.dataset.lvl);}
  if(el.dataset.item!==undefined){G.sel=+el.dataset.item;G.quitArm=false;return refreshSel();}
  const a=el.dataset.act;
  if(a==='closeov')return closeOverlays();
  if(a==='navi')return showNavi();
  if(a==='drive')return choose();
  if(a==='unsub'){G.sub=null;buildItems();return renderGame();}
  if(a==='uturn')return uturn();
  if(a==='refuel')return refuel();
  if(a==='endless'){resetArm=false;try{window.scrollTo(0,0);}catch(e){}return startGame('endless');}
  if(a==='next')return startGame('level',G.idx+1);
  if(a==='retry')return startGame('level',G.idx);
  if(a==='home'){try{window.scrollTo(0,0);}catch(e){}return renderHome();}
  if(a==='quit'){
    if(G.quitArm){if(G.mode==='endless'){save.streak=0;persist();}return renderHome();}
    G.quitArm=true;refreshHud();toast(G.mode==='endless'?'Nochmal tippen zum Beenden (Serie endet)':'Nochmal tippen zum Beenden','dark');
    setTimeout(()=>{if(G&&G.quitArm){G.quitArm=false;refreshHud();}},2600);return;
  }
  if(a==='reset'){
    if(!resetArm){resetArm=true;renderHome();setTimeout(()=>{if(resetArm){resetArm=false;if(!G)renderHome();}},3000);return;}
    resetArm=false;save={unlocked:1,stars:{},best:0,streak:0,sights:[]};persist();renderHome();toast('Fortschritt zurückgesetzt','dark');
  }
});
renderHome();
</script>
</body>
</html>
